[package]
name = "mado-mdpreview"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "mado-mdpreview"
path = "src/main.rs"

[dependencies]
pulldown-cmark = "0.12"
fontdue = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6"

[profile.release]
opt-level = 3
strip = true
